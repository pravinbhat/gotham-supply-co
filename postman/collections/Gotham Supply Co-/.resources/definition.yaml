$kind: collection
name: Gotham Supply Co.
description: |-
  Fan-made, non-commercial Temporal learning project. Three microservices, each with its own REST API, SQLite database and Temporal worker:

  - batcave-order-ops (Go, :8081): OrderWorkflow, the saga
  - wayne-billing (Java, :8082): ChargeWorkflow
  - batcave-armory (Python, :8083): FulfillmentWorkflow

  Start the stack with `make up`, then:

  1. **Order Ops > Create Order** places an order. Its script saves `order_id`.
  2. **Order Ops > Get Order**, re-run until `status` is `COMPLETED`. Its script saves `reservation_id`, `charge_id`, `total_cents`, and the saga's `idempotency_key`.
  3. The Billing and Armory requests then replay the calls the saga already made, to show that they're idempotent.
variables:
  order_url: http://localhost:8081
  billing_url: http://localhost:8082
  armory_url: http://localhost:8083
  order_id: ""
  reservation_id: ""
  charge_id: ""
  total_cents: ""
  idempotency_key: ""

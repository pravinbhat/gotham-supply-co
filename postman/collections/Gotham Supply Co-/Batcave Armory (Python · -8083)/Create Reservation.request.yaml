$kind: http-request
description: Idempotent on order_id — calling this twice with the same order_id returns the same reservation rather than double-holding stock.
url: "{{armory_url}}/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "order_id": "{{order_id}}",
      "items": [
        { "sku": "BAT-001", "quantity": 2 },
        { "sku": "ALF-301", "quantity": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          pm.collectionVariables.set('reservation_id', pm.response.json().reservation_id);
      }
    language: text/javascript
order: 4000

$kind: http-request
description: |-
  Returns 202 with {order_id, workflow_id, run_id, status}. The order then runs asynchronously as OrderWorkflow; follow it with Get Order.
  The script saves order_id and clears the IDs captured from any previous order.
url: "{{order_url}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "customer_id": "selina-kyle",
      "items": [
        { "sku": "BAT-001", "quantity": 2 },
        { "sku": "ALF-301", "quantity": 1 }
      ],
      "shipping_address": {
        "name": "Selina Kyle",
        "street": "1 Rooftop Way",
        "city": "Gotham",
        "country": "US"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 202) {
          const body = pm.response.json();
          pm.collectionVariables.set('order_id', body.order_id);
          // Clear IDs from any previous order; Get Order fills them in for this one.
          ['reservation_id', 'charge_id', 'total_cents', 'idempotency_key']
              .forEach((k) => pm.collectionVariables.set(k, ''));
          console.log('Saved order_id =', body.order_id);
      }
    language: text/javascript
order: 2000

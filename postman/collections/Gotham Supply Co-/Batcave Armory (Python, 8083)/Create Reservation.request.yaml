$kind: http-request
description: |-
  Replays the saga's reservation. For an order the saga already reserved, the armory returns that same reservation (status PICKED once shipped) instead of holding stock twice; the items in the body are ignored.
  For an order with no reservation (for example the out-of-stock order), this creates a new HELD reservation that nothing will release until compensation exists (Phase 2).
url: "{{armory_url}}/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "order_id": "{{order_id}}",
      "items": [
        { "sku": "BAT-001", "quantity": 2 },
        { "sku": "ALF-301", "quantity": 1 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          pm.collectionVariables.set('reservation_id', pm.response.json().reservation_id);
      }
    language: text/javascript
order: 4000
